<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 620" width="860" height="620" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b6b66"/>
    </marker>
    <marker id="arrowLoop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b6ea5"/>
    </marker>
  </defs>

  <rect width="860" height="620" rx="12" fill="#fbfbfa"/>
  <text x="32" y="42" font-size="19" font-weight="600" fill="#1a1a18">The agent loop</text>
  <text x="32" y="62" font-size="13" fill="#6b6b66">Ask, observe, act, repeat — with a bound on how many times.</text>

  <!-- 1 list tools -->
  <rect x="270" y="86" width="320" height="52" rx="8" fill="#ffffff" stroke="#cfcfc9"/>
  <text x="430" y="108" font-size="13" font-weight="600" fill="#1a1a18" text-anchor="middle">tools := Toolset.List(ctx)</text>
  <text x="430" y="126" font-size="11" fill="#6b6b66" text-anchor="middle">fetched per run, so new tools appear without a restart</text>
  <line x1="430" y1="138" x2="430" y2="164" stroke="#6b6b66" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- 2 transcript -->
  <rect x="270" y="168" width="320" height="52" rx="8" fill="#ffffff" stroke="#cfcfc9"/>
  <text x="430" y="190" font-size="13" font-weight="600" fill="#1a1a18" text-anchor="middle">transcript := [system, user]</text>
  <text x="430" y="208" font-size="11" fill="#6b6b66" text-anchor="middle">the model is stateless — this slice is the memory</text>
  <line x1="430" y1="220" x2="430" y2="248" stroke="#6b6b66" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- 3 guard -->
  <rect x="290" y="252" width="280" height="40" rx="8" fill="#fff8e8" stroke="#b8902e"/>
  <text x="430" y="277" font-size="13" font-weight="600" fill="#8a6a1f" text-anchor="middle">step ≤ maxSteps ?</text>
  <line x1="430" y1="292" x2="430" y2="320" stroke="#6b6b66" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="444" y="310" font-size="11" fill="#6b6b66">yes</text>

  <!-- step limit exit -->
  <line x1="570" y1="272" x2="676" y2="272" stroke="#a33b3b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="620" y="264" font-size="11" fill="#a33b3b" text-anchor="middle">no</text>
  <rect x="680" y="248" width="150" height="48" rx="8" fill="#fbeeee" stroke="#a33b3b"/>
  <text x="755" y="270" font-size="12" font-weight="700" fill="#8c3232" text-anchor="middle">ErrStepLimit</text>
  <text x="755" y="286" font-size="10" fill="#6b6b66" text-anchor="middle">bail out, never spin</text>

  <!-- 4 chat -->
  <rect x="270" y="324" width="320" height="52" rx="8" fill="#fbf1e8" stroke="#a35b2e"/>
  <text x="430" y="346" font-size="13" font-weight="700" fill="#8a4d26" text-anchor="middle">reply := Model.Chat(ctx, transcript, tools)</text>
  <text x="430" y="364" font-size="11" fill="#6b6b66" text-anchor="middle">the only place the model is consulted</text>
  <line x1="430" y1="376" x2="430" y2="404" stroke="#6b6b66" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- 5 decision -->
  <rect x="290" y="408" width="280" height="40" rx="8" fill="#fff8e8" stroke="#b8902e"/>
  <text x="430" y="433" font-size="13" font-weight="600" fill="#8a6a1f" text-anchor="middle">reply.ToolCalls empty ?</text>

  <!-- final answer -->
  <line x1="570" y1="428" x2="676" y2="428" stroke="#2e7d5b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="620" y="420" font-size="11" fill="#256349" text-anchor="middle">yes</text>
  <rect x="680" y="404" width="150" height="48" rx="8" fill="#ecf5f1" stroke="#2e7d5b"/>
  <text x="755" y="426" font-size="12" font-weight="700" fill="#256349" text-anchor="middle">final answer</text>
  <text x="755" y="442" font-size="10" fill="#6b6b66" text-anchor="middle">+ the tool-call trace</text>

  <line x1="430" y1="448" x2="430" y2="476" stroke="#6b6b66" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="444" y="466" font-size="11" fill="#6b6b66">no</text>

  <!-- 6 run tools -->
  <rect x="230" y="480" width="400" height="96" rx="8" fill="#ecf5f1" stroke="#2e7d5b"/>
  <text x="430" y="502" font-size="13" font-weight="700" fill="#256349" text-anchor="middle">for each tool call: Toolset.Call(ctx, name, args)</text>
  <text x="430" y="522" font-size="11" fill="#1a1a18" text-anchor="middle">append the assistant message (which calls were made)</text>
  <text x="430" y="539" font-size="11" fill="#1a1a18" text-anchor="middle">append one tool message per result, tagged with tool_name</text>
  <text x="430" y="562" font-size="11" font-style="italic" fill="#8c3232" text-anchor="middle">a failure becomes text for the model, not an HTTP 500</text>

  <!-- loop back -->
  <path d="M230,528 L150,528 L150,272 L286,272" fill="none" stroke="#3b6ea5" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrowLoop)"/>
  <text x="142" y="404" font-size="11" font-weight="600" fill="#2c5580" text-anchor="end">step++</text>
  <text x="142" y="420" font-size="11" fill="#6b6b66" text-anchor="end">transcript grows</text>
</svg>
