<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b6b66"/>
    </marker>
  </defs>

  <rect width="1000" height="460" rx="12" fill="#fbfbfa"/>
  <text x="32" y="42" font-size="19" font-weight="600" fill="#1a1a18">What the model sees on each turn</text>
  <text x="32" y="62" font-size="13" fill="#6b6b66">The whole transcript is resent every time. Tool results are just more messages.</text>

  <!-- turn 1 -->
  <text x="40" y="100" font-size="13" font-weight="700" fill="#2c5580">Turn 1 — request</text>
  <rect x="40" y="112" width="270" height="46" rx="7" fill="#f2f2ef" stroke="#cfcfc9"/>
  <text x="56" y="132" font-size="11" font-weight="700" fill="#6b6b66">system</text>
  <text x="56" y="149" font-size="11" fill="#1a1a18">"You are a weather assistant…"</text>

  <rect x="40" y="166" width="270" height="46" rx="7" fill="#eef3f9" stroke="#b9cbe0"/>
  <text x="56" y="186" font-size="11" font-weight="700" fill="#2c5580">user</text>
  <text x="56" y="203" font-size="11" fill="#1a1a18">"What is the weather in Belgrade?"</text>

  <line x1="175" y1="222" x2="175" y2="252" stroke="#6b6b66" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="40" y="272" font-size="13" font-weight="700" fill="#8a4d26">Turn 1 — model replies</text>
  <rect x="40" y="284" width="270" height="62" rx="7" fill="#fbf1e8" stroke="#a35b2e"/>
  <text x="56" y="304" font-size="11" font-weight="700" fill="#8a4d26">assistant</text>
  <text x="56" y="321" font-size="11" fill="#1a1a18">content: ""</text>
  <text x="56" y="338" font-size="11" font-weight="600" fill="#1a1a18">tool_calls: [get_weather{city:"Belgrade"}]</text>
  <text x="40" y="368" font-size="11" font-style="italic" fill="#6b6b66">No prose. The model is asking, not answering.</text>

  <line x1="326" y1="230" x2="376" y2="230" stroke="#6b6b66" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- turn 2 -->
  <text x="392" y="100" font-size="13" font-weight="700" fill="#2c5580">Turn 2 — request (same four fields, two more messages)</text>
  <rect x="392" y="112" width="290" height="34" rx="7" fill="#f2f2ef" stroke="#cfcfc9"/>
  <text x="408" y="134" font-size="11" fill="#6b6b66"><tspan font-weight="700">system</tspan>  (unchanged)</text>

  <rect x="392" y="152" width="290" height="34" rx="7" fill="#eef3f9" stroke="#b9cbe0"/>
  <text x="408" y="174" font-size="11" fill="#6b6b66"><tspan font-weight="700" fill="#2c5580">user</tspan>  (unchanged)</text>

  <rect x="392" y="192" width="290" height="50" rx="7" fill="#fbf1e8" stroke="#a35b2e"/>
  <text x="408" y="211" font-size="11" font-weight="700" fill="#8a4d26">assistant</text>
  <text x="408" y="229" font-size="11" fill="#1a1a18">tool_calls: [get_weather{…}]  ← the request</text>

  <rect x="392" y="248" width="290" height="66" rx="7" fill="#ecf5f1" stroke="#2e7d5b" stroke-width="2"/>
  <text x="408" y="267" font-size="11" font-weight="700" fill="#256349">tool</text>
  <text x="408" y="284" font-size="11" font-weight="600" fill="#1a1a18">tool_name: "get_weather"  ← the match</text>
  <text x="408" y="303" font-size="11" fill="#1a1a18">content: {"city":"Belgrade","temperature_c":24…}</text>
  <text x="392" y="336" font-size="11" font-style="italic" fill="#6b6b66">Without tool_name the model cannot tell which</text>
  <text x="392" y="351" font-size="11" font-style="italic" fill="#6b6b66">result answers which call.</text>

  <line x1="698" y1="230" x2="748" y2="230" stroke="#6b6b66" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- final -->
  <text x="764" y="100" font-size="13" font-weight="700" fill="#256349">Turn 2 — model replies</text>
  <rect x="764" y="112" width="206" height="90" rx="7" fill="#ecf5f1" stroke="#2e7d5b"/>
  <text x="780" y="132" font-size="11" font-weight="700" fill="#256349">assistant</text>
  <text x="780" y="151" font-size="11" fill="#1a1a18">"It is 24°C and sunny</text>
  <text x="780" y="168" font-size="11" fill="#1a1a18">in Belgrade."</text>
  <text x="780" y="190" font-size="11" font-weight="600" fill="#1a1a18">tool_calls: none</text>

  <text x="764" y="228" font-size="11" font-style="italic" fill="#6b6b66">No tool calls means</text>
  <text x="764" y="243" font-size="11" font-style="italic" fill="#6b6b66">the loop is done.</text>

  <rect x="764" y="266" width="206" height="48" rx="7" fill="#ffffff" stroke="#cfcfc9"/>
  <text x="867" y="286" font-size="11" font-weight="700" fill="#1a1a18" text-anchor="middle">steps: 2</text>
  <text x="867" y="303" font-size="11" fill="#6b6b66" text-anchor="middle">tool_calls: 1</text>

  <text x="32" y="418" font-size="12" fill="#6b6b66">Every turn costs the full transcript in tokens — which is why a step limit is a cost control, not only a safety net.</text>
</svg>
