# Three services, matching the three roles in the README:
#   ollama      the model
#   mcp-server  the tools
#   agent       the loop that connects them
name: simple-ai-orchestration

services:

  agent:
    build:
      context: .
      dockerfile: build/Dockerfile
      args:
        BINARY: agent
    ports:
      - "${AGENT_PORT:-8080}:8080"
    environment:
      AGENT_ADDR: ":8080"
      # Service names, not localhost: each container has its own loopback.
      OLLAMA_URL: "http://ollama:11434"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-llama3.2}"
      MCP_URL: "http://mcp-server:8081/mcp"
      AGENT_MAX_STEPS: "${AGENT_MAX_STEPS:-5}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    depends_on:
      mcp-server:
        condition: service_started
      ollama-pull:
        condition: service_completed_successfully
    restart: unless-stopped

  mcp-server:
    build:
      context: .
      dockerfile: build/Dockerfile
      args:
        BINARY: mcp-server
    environment:
      MCP_ADDR: ":8081"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    # Not published: the tool server is reachable only from inside the network.
    expose:
      - "8081"
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  # A one-shot job, not a service: it pulls the model and exits. The agent
  # waits for it to succeed, so the first request never hits a missing model.
  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: "ollama:11434"
    volumes:
      - ollama-data:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull ${OLLAMA_MODEL:-llama3.2}"]

volumes:
  ollama-data:
